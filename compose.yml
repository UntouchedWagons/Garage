name: garage

services:
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml
      - meta:/var/lib/garage/meta
      - data:/var/lib/garage/data
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GKa9e30ee69dde60ec5ebaa2ac9035c438
      GARAGE_DEFAULT_SECRET_KEY: 7e6aabd35d9a8eb85493faf00d488689ec405b47dbc25713b0a980c0e442de03
    networks:
      - traefik_default
    command: /garage server --single-node
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.garage-api.rule=Host(`s3.vault.internal.untouchedwagons.com`)"
      - "traefik.http.routers.garage-api.service=garage-api-svc"
      - "traefik.http.services.garage-api-svc.loadbalancer.server.port=3900"

  garage-ui:
    image: noooste/garage-ui:v0.14.0
    container_name: garage-ui
    depends_on:
      - garage
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      # Garage S3 Configuration
      GARAGE_UI_GARAGE_ENDPOINT: "garage:3900"
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: "http://garage:3903"

      # Server Configuration
      GARAGE_UI_SERVER_HOST: "0.0.0.0"
      GARAGE_UI_SERVER_PORT: "8080"
      GARAGE_UI_SERVER_ENVIRONMENT: "production"

      # JWT Configuration
      # IMPORTANT: Replace this with your own Ed25519 private key in production!
      # Generate with: openssl genpkey -algorithm ED25519
      GARAGE_UI_AUTH_JWT_PRIVATE_KEY: |
        -----BEGIN PRIVATE KEY-----
        MC4CAQAwBQYDK2VwBCIEIBe2k2yJoNNJPI6pYd0rg71d0lCoDA2Pc5QgD6SZVbsr
        -----END PRIVATE KEY-----
    networks:
      - traefik_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.garage-webui.rule=Host(`garage.vault.internal.untouchedwagons.com`)"
      - "traefik.http.routers.garage-webui.service=garage-webui-svc"
      - "traefik.http.services.garage-webui-svc.loadbalancer.server.port=8080"

networks:
  traefik_default:
    external: true

volumes:
  meta:
  data:
